version: '3.8'

# App code comes from git (cloned/polled by deploy/entrypoint.sh inside the
# container), so pushing to the remote auto-deploys. The host only needs this
# compose file + the Dockerfiles; no source checkout required.
# The default GIT_URL is the public GitHub mirror, so no credentials are needed.
# Override GIT_URL/GIT_REF/GIT_TOKEN/GIT_POLL_SECS in a .env file (.env.example).
x-git-env: &git-env
  GIT_URL: ${GIT_URL:-https://github.com/rafaelmuylaert/buraco.git}
  GIT_REF: ${GIT_REF:-main}
  GIT_TOKEN: ${GIT_TOKEN:-}
  GIT_POLL_SECS: ${GIT_POLL_SECS:-60}

services:
  buraco-server:
    build:
      context: .
      dockerfile: buraco-server/Dockerfile
    container_name: buraco-server
    command: ["server"]
    environment: *git-env
    ports:
      - "8000:8000"
    volumes:
      - ./buraco-server/db:/data/db
      - ./buraco-server/bots:/data/bots
    restart: unless-stopped

  buraco-client:
    build:
      context: .
      dockerfile: buraco-client/Dockerfile
    container_name: buraco-client
    command: ["client"]
    environment: *git-env
    ports:
      - "5173:5173"
    depends_on:
      - buraco-server
    restart: unless-stopped

  buraco-bot:
    build:
      context: .
      dockerfile: buraco-server/Dockerfile
    container_name: buraco-bot
    command: ["bot"]
    environment: *git-env
    depends_on:
      - buraco-server
    restart: unless-stopped
