<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig config for headless Chromium when the host has no system
  fonts installed. It points at the DejaVu fonts extracted by
  scripts/fetch-chromium-libs.sh (which overwrites THIS file with the absolute
  path, so the relative path below is only a fallback).

  If you install fonts system-wide (apt install fonts-dejavu-core), you do NOT
  need this file at all — just don't set FONTCONFIG_FILE.
-->
<fontconfig>
  <dir>.chromium-libs/dejavu-fonts</dir>
  <cachedir>.chromium-libs/fc-cache</cachedir>
  <match>
    <test qual="any"><name>DejaVu Sans</name></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
